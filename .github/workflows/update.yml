name: Scrape & deploy

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      rebuild_static:
        description: "Also rebuild maps + past results (rarely needed)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["data/live/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build static data (maps + past results) if missing or requested
        run: |
          if [ "${{ inputs.rebuild_static }}" = "true" ] || [ ! -f data/static/tx_cd2025.geojson ]; then
            python scripts/build_static.py
          fi
      - name: Scrape live data
        run: cd scraper && python run_all.py
      - name: Commit data
        run: |
          git config user.name "tx26-bot"
          git config user.email "tx26-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
